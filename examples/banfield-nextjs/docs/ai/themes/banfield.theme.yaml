# Client Brand Theme
# Generated by the theme extraction skill from a client website.
# Place in: docs/ai/themes/<client-kebab>.theme.yaml

client:
  name: "Banfield"
  sourceUrl: "https://www.banfield.com/"
  extractedAt: "2026-09-25T21:10:00Z"
  extractedBy: "cursor-agent"

colors:
  primary: "#D74100"
  primaryForeground: "#ffffff"
  secondary: "#00A3C4"
  secondaryForeground: "#ffffff"
  accent: "#D74100"
  accentForeground: "#ffffff"
  background: "#ffffff"
  foreground: "#3D3D3D"
  muted: "#F7F7F7"
  mutedForeground: "#65686B"
  headerBackground: "#ffffff"
  headerForeground: "#3D3D3D"
  footerBackground: "#ffffff"
  footerForeground: "#65686B"
  border: "#E6E6E6"
  ring: "#D74100"
  extra:
    - { name: "orange", value: "#D74100" }
    - { name: "teal", value: "#00A3C4" }
    - { name: "newsletterBand", value: "#D74100" }
    - { name: "bodyGray", value: "#65686B" }

typography:
  headingFamily: "'Zilla Slab', serif"
  headingWeight: "600"
  bodyFamily: "'Poppins', sans-serif"
  bodyWeight: "400"
  monoFamily: "ui-monospace, SFMono-Regular, Menlo, monospace"
  googleFontsUrl: "https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Zilla+Slab:wght@500;600;700&display=swap"
  scale:
    hero: "4rem"
    h1: "3.5rem"
    h2: "2rem"
    h3: "1.5rem"
    body: "1.08rem"
    small: "0.875rem"
  headingTransform: "none"
  letterSpacing: "normal"
  lineHeight: "relaxed"

spacing:
  density: "spacious"
  sectionGap: "6rem"
  containerMaxWidth: "1140px"
  containerPadding: "1.5rem"

shape:
  borderRadius: "9999px"
  buttonRadius: "9999px"
  cardRadius: "0px"
  imageRadius: "9999px"
  shadowStyle: "none"
  borderStyle: "none"

tone:
  overall: "playful"
  colorMode: "light"
  contrast: "medium"
  imagery: "photography"
  heroStyle: "split-image-text"
  cardStyle: "flat"
  navStyle: "minimal"

tailwind:
  colors:
    brand:
      primary: "#D74100"
      secondary: "#00A3C4"
      accent: "#D74100"
  fontFamily:
    heading: ["Zilla Slab", "serif"]
    body: ["Poppins", "sans-serif"]
  borderRadius:
    DEFAULT: "9999px"
    button: "9999px"
    card: "0px"

cssVariables: |
  :root {
    --brand-primary: #D74100;
    --brand-primary-foreground: #ffffff;
    --brand-secondary: #00A3C4;
    --brand-secondary-foreground: #ffffff;
    --brand-accent: #D74100;
    --brand-accent-foreground: #ffffff;
    --brand-bg: #ffffff;
    --brand-fg: #3D3D3D;
    --brand-muted: #F7F7F7;
    --brand-muted-fg: #65686B;
    --brand-header-bg: #ffffff;
    --brand-header-fg: #3D3D3D;
    --brand-footer-bg: #ffffff;
    --brand-footer-fg: #65686B;
    --brand-border: #E6E6E6;
    --brand-ring: #D74100;
    --brand-heading-font: 'Zilla Slab', serif;
    --brand-body-font: 'Poppins', sans-serif;
    --brand-radius: 9999px;
    --brand-button-radius: 9999px;
    --brand-card-radius: 0px;
  }

extraction:
  confidence: "medium"
  method: "playwright-full"
  notes:
    - "Primary orange #D74100 is from computed primary-button text (rgb(215, 65, 0)). Filled CTAs and the newsletter band use this same orange."
    - "Page is almost entirely white. Header is a white/transparent bar; footer is white with a full-bleed orange newsletter strip above it."
    - "Headlines use Zilla Slab (serif, weight 600) at ~64px; body and some H2s use Poppins. Content is written in lowercase."
    - "GT Walsheim Bold is a proprietary wordmark font (bhere). Demo uses Poppins as the sans substitute."
    - "Buttons are pill-shaped (fully rounded). Hero CTAs are orange outline pills on white, not solid fills."
    - "Card imagery is circular; cards themselves are flat with no shadow or border."
    - "Hero is split-image-text: large lowercase headline + body + two outline CTAs on the left, veterinarian photo on the right. Not a full-bleed overlay."
    - "Teal #00A3C4 is a visual sample from illustration panels (glow-up card, meds card). Not a CSS custom property."
    - "Scraper :root variables were leftover Bootstrap tokens (#007bff / #6c757d) — ignored."
    - "Older public brand sheets list green #047832 and gold #BD9C52. Those do not match the current banfield.com homepage."
    - "Google Fonts links in meta.json are Roboto / Google Sans from third-party embeds (maps, Instagram), not the brand typeface."
    - "Logo downloaded to docs/ai/themes/banfield/images/logo.svg (Banfield bhere wordmark)."
